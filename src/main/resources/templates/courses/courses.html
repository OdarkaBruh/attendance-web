<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>

<nav class="nav nav-tabs navbar-expand-lg bg-primary bg-opacity-50 justify-content-between px-3 pt-3">
    <!-- Navbar content -->
    <ul class="navbar-nav pt-2 mt-1">
        <li class="nav-item mx-2">
            <a class="nav-link active px-3" th:href="@{/courses/all}">Courses</a>
        </li>
        <li class="nav-item mx-2">
            <a class="nav-link text-white bg-primary bg-opacity-50 px-3" th:href="@{/students/all}">Students</a>
        </li>
    </ul>
    <a class="btn btn-light mx-3 mb-3" th:href="@{/courses/add}">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
    </svg> Add course </a>

</nav>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Teacher</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="course : ${courses}" th:object="${course}">
        <td th:text="*{id}"></td>
        <td> <a class="text-decoration-none text-reset" th:text="*{name}" th:href="@{/courses/{id}(id=*{id})}"></a></td>
        <td th:text="*{description}"></td>
        <td th:if="*{teacher != null}" th:text="*{teacher.firstName} + ' ' + *{teacher.lastName}"></td>
        <td th:else></td>
    </tr>
    </tbody>
</table>

</body>
</html>
