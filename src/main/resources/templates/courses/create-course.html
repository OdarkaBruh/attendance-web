<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary justify-content-between px-3">
    <div class="btn btn-light">
        <a class="nav-link" th:href="@{/courses/all}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
            Go back </a>
    </div>
</nav>

<h2 class="text-center pt-4">Create Course</h2>
<form class="container-fluid px-4" th:action="@{/courses/add}" method="post" th:object="${course}">
    <div class="mb-3">
        <label class="form-label"> Name: </label>
        <input class="form-control form-control-lg" type="text"
               th:field="*{name}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label"> Description: </label> <br />
            <textarea class="form-control form-control-lg" type="text"
                  th:field="*{description}" rows="3"> </textarea>
    </div>

    <div class="mb-3">
        <label class="form-label"> Teacher: </label> <br />
        <select class="form-select" th:field="*{teacher}">
            <option th:value="-1"></option>
            <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:text="${teacher.firstName} + ' ' + ${teacher.lastName}"></option>
        </select>
    </div>

    <button class="btn btn-outline-success" type="submit">Create course</button>
</form>
</body>
