<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- Back button -->
    <div class="mb-4">
        <a th:href="@{/courses}" class="btn btn-outline-secondary">
            &larr; Back to courses
        </a>
    </div>

    <!-- Course information -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0" th:text="${course.name}">
                Course name
            </h2>
        </div>

        <div class="card-body">

            <h5 class="text-secondary">Course information</h5>

            <div class="mb-4">
                <strong>Course ID:</strong>
                <span th:text="${course.id}"></span>
            </div>

            <div class="mb-4">
                <strong>Description:</strong>
                <p class="mt-2"
                   th:text="${course.description}">
                    Course description
                </p>
            </div>

            <hr>

            <!-- Teacher information -->
            <h5 class="text-secondary mb-3">Teacher</h5>

            <div th:if="${course.teacher != null}">
                <p>
                    <strong>Name:</strong>
                    <span th:text="${course.teacher.firstName + ' ' + course.teacher.lastName}"></span>
                </p>

                <p>
                    <strong>Position:</strong>
                    <span th:text="${course.teacher.position}"></span>
                </p>
            </div>

            <div th:if="${course.teacher == null}">
                <p class="text-muted">
                    No teacher assigned to this course.
                </p>
            </div>

        </div>

        <div class="card-footer text-end">
            <a th:href="@{/courses}" class="btn btn-secondary">
                Close
            </a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
